# Shared CI setup: Python with the project's requirements, and (optionally) the native engine.
#
# torch comes from PyTorch's CPU index first: the default wheel pulls several GB of CUDA libraries
# that a GitHub runner has no GPU to use. requirements.txt then sees torch already satisfied.
#
# The engine is built through check_engine_fresh.sh, not a bare `cmake --build`: the script writes
# build/release/.engine_fingerprint, and tests/conftest.py refuses to run against an unstamped
# build. On a fresh directory the script rebuilds and exits 1 by design ("was stale, now
# rebuilt"), so the second call is the one that must exit 0.
name: setup
description: Python, requirements and the clang-built ts_engine extension
inputs:
  build-engine:
    description: build the native engine and its nanobind extension
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install Python requirements (CPU torch)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r requirements.txt

    # llvm and lld: the build links with -flto, and on Ubuntu the `clang` package alone brings
    # neither llvm-ar nor a linker that reads LTO objects (the root CMakeLists.txt checks).
    - name: Install clang
      if: inputs.build-engine == 'true'
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -y -q clang llvm lld libgomp1

    - name: Build the engine
      if: inputs.build-engine == 'true'
      shell: bash
      env:
        TS_PYTHON: python
      run: |
        cmake -B build/release -S . -DPython_EXECUTABLE="$(command -v python)"
        tools/scripts/check_engine_fresh.sh || true
        tools/scripts/check_engine_fresh.sh
