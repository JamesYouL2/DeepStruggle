# Stage 1 of the catastrophic-blunder census (tools/scripts/blunder_census.py screen): self-play games
# of a checkpoint, every decision screened. Stage 2 is bank_playouts.yml stage=validate, on a release
# of the concatenated candidates and control rows.
#
#   gh workflow run blunder_screen.yml --ref <branch> -f model=<run>/<file>.pt -f games=400 -f runners=4
#   gh run download <run-id> -n blunder-screen-<run-id> -D data/reports/blunder_census/<name>/screen
name: blunder-screen

on:
  # Registers the branch-only workflow (GitHub will not dispatch one it has never seen run); a
  # push run skips every job.
  push:
    branches: [exp/j1-census]
    paths: [.github/workflows/blunder_screen.yml]
  workflow_dispatch:
    inputs:
      model:
        description: "The .pt in the Hugging Face repo the census is about"
        required: true
      games:
        description: "Self-play games over all parts"
        default: "400"
      runners:
        description: "Parts (one job each)"
        default: "4"
      args:
        description: "Further arguments for the screen stage (--seed, --temperature, ...)"
        default: ""
      hf_repo:
        description: "Hugging Face repo"
        default: "mihaild/deepstruggle"

permissions:
  contents: read

env:
  PYTHONPATH: .:build/release
  MODEL: ${{ inputs.model }}
  GAMES: ${{ inputs.games || '400' }}
  RUNNERS: ${{ inputs.runners || '4' }}
  ARGS: ${{ inputs.args || '' }}
  HF_REPO: ${{ inputs.hf_repo || 'mihaild/deepstruggle' }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        run: echo "parts=$(python3 -c "import json,os; print(json.dumps(list(range(1, int(os.environ['RUNNERS']) + 1))))")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Fetch the model
        run: |
          mkdir -p data/checkpoints/hf
          curl -sSfL --retry 3 -o "data/checkpoints/hf/$(basename "$MODEL")" "https://huggingface.co/$HF_REPO/resolve/main/$MODEL"
          sha256sum "data/checkpoints/hf/$(basename "$MODEL")"
      - name: screen (part ${{ matrix.part }})
        run: |
          OMP_NUM_THREADS=4 python tools/scripts/blunder_census.py screen \
            --model "data/checkpoints/hf/$(basename "$MODEL")" --games "$GAMES" \
            --part "${{ matrix.part }}/$RUNNERS" --out-dir "out/part-${{ matrix.part }}" $ARGS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blunder-screen-part-${{ github.run_id }}-${{ matrix.part }}
          path: out/
          retention-days: 14

  pool:
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: blunder-screen-part-${{ github.run_id }}-*
          path: parts
          merge-multiple: true
      - name: Pool
        run: |
          mkdir -p report
          cat parts/part-*/candidates.jsonl.gz > report/candidates.jsonl.gz
          cat parts/part-*/control.jsonl.gz > report/control.jsonl.gz
          for d in parts/part-*; do cp "$d/summary.json" "report/summary-$(basename "$d").json" || true; done
          {
            echo "commit: $GITHUB_SHA"
            echo "model: $HF_REPO $MODEL  games: $GAMES  args: $ARGS"
            echo "parts: $RUNNERS (received: $(ls -d parts/part-* | wc -l))"
            echo "candidates: $(zcat report/candidates.jsonl.gz | wc -l)  control: $(zcat report/control.jsonl.gz | wc -l)"
          } > report/provenance.txt
          cat report/provenance.txt
      - uses: actions/upload-artifact@v7
        with:
          name: blunder-screen-${{ github.run_id }}
          path: report/
          retention-days: 90
