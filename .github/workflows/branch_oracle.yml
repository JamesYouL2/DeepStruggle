# Check a named decision in a review game by paired playouts (tools/branch_oracle.py).
#
#   gh workflow run branch_oracle.yml -f games_run=<review-games run id> \
#     -f game=review_E6-06-44_soup_680-760_seed9100001.tslog.json -f step=63 \
#     -f alts="test_ban=33 duck_ops=3,112" -f pairs=512
#   gh run download <run-id> -n branch-oracle-<run-id> -D data/reports/ci
#
# `alts` is space-separated `name=a,b,c` specs: flat actions forced in order from the decision.
# Find the indices with `tools/branch_oracle.py options --replay <game> --step <n> --model <onnx>
# [--prefix a,b]` on the downloaded replay. The model's own choice (and the recorded move, if it
# differs) are always branches.
name: branch-oracle

on:
  # Registers the branch-only workflow (GitHub will not dispatch one it has never seen run); a
  # push run skips every job, since there is no decision to check.
  push:
    branches: [exp/hungary-openings]
    paths: [.github/workflows/branch_oracle.yml]
  workflow_dispatch:
    inputs:
      games_run:
        description: "Run id of the review-games run that holds the replay"
        required: true
      game:
        description: "Replay file name inside that run's artifact"
        required: true
      step:
        description: "Step index of the decision"
        required: true
      alts:
        description: "Space-separated name=a,b,c alternatives"
        required: true
      pairs:
        description: "Paired playouts per branch"
        default: "512"
      hidden:
        description: "resample (redeal what the decider could not see) or true (the game's real cards)"
        default: "resample"
      runners:
        description: "Runners to spread the pairs over"
        default: "8"
      model:
        description: "`newest` or hf:<file.onnx>; should be the model that played the game"
        default: "newest"
      hf_repo:
        description: "Hugging Face repo that `newest` is read from"
        default: "mihaild/deepstruggle"

permissions:
  contents: read
  actions: read     # to download the review-games run's artifact

env:
  GAME: ${{ inputs.game }}
  STEP: ${{ inputs.step }}
  ALTS: ${{ inputs.alts }}
  PAIRS: ${{ inputs.pairs || '512' }}
  HIDDEN: ${{ inputs.hidden || 'resample' }}
  RUNNERS: ${{ inputs.runners || '8' }}
  MODEL: ${{ inputs.model || 'newest' }}
  HF_REPO: ${{ inputs.hf_repo || 'mihaild/deepstruggle' }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      file: ${{ steps.pin.outputs.file }}
      parts: ${{ steps.pin.outputs.parts }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin the model and list the parts
        id: pin
        run: |
          if [ "$MODEL" = "newest" ]; then
            f=$(python3 tools/fetch_hf_model.py --repo "$HF_REPO" --resolve-only | tail -1)
          else
            f="${MODEL#hf:}"
          fi
          echo "file=$f" >> "$GITHUB_OUTPUT"
          python3 -c "import json,os; print('parts=' + json.dumps(list(range(1, int(os.environ['RUNNERS']) + 1))))" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: review-games-${{ inputs.games_run }}
          run-id: ${{ inputs.games_run }}
          github-token: ${{ github.token }}
          path: review/

      - uses: actions/upload-artifact@v4
        with:
          name: branch-oracle-replay-${{ github.run_id }}
          path: review/${{ inputs.game }}
          if-no-files-found: error

  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - uses: actions/download-artifact@v4
        with:
          name: branch-oracle-replay-${{ github.run_id }}
          path: review/

      - name: Play part ${{ matrix.part }} of ${{ env.RUNNERS }}
        run: |
          python3 tools/fetch_hf_model.py --repo "$HF_REPO" --path "${{ needs.plan.outputs.file }}" --out-dir data/checkpoints
          mkdir -p parts
          alt_args=""
          for a in $ALTS; do alt_args="$alt_args --alt $a"; done
          tools/scripts/check_engine_fresh.sh && PYTHONPATH=.:build/release .venv/bin/python tools/branch_oracle.py run \
            --replay "review/$GAME" --step "$STEP" \
            --model "data/checkpoints/$(basename "${{ needs.plan.outputs.file }}")" \
            $alt_args --pairs "$PAIRS" --hidden "$HIDDEN" --part "${{ matrix.part }}/$RUNNERS" \
            --out "parts/part-${{ matrix.part }}.jsonl"

      - uses: actions/upload-artifact@v4
        with:
          name: branch-oracle-part-${{ github.run_id }}-${{ matrix.part }}
          path: parts/
          if-no-files-found: error

  pool:
    needs: [plan, play]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - uses: actions/download-artifact@v4
        with:
          pattern: branch-oracle-part-${{ github.run_id }}-*
          path: parts/
          merge-multiple: true

      - name: Pool the parts
        run: |
          mkdir -p reports
          n=$(ls parts/part-*.jsonl 2>/dev/null | wc -l)
          if [ "$n" -ne "$RUNNERS" ]; then echo "only $n of $RUNNERS parts arrived; re-run the failed jobs"; exit 1; fi
          PYTHONPATH=.:build/release .venv/bin/python tools/branch_oracle.py report \
            --parts parts/part-*.jsonl --out-md reports/report.md --out-json reports/report.json
          {
            echo "commit: $GITHUB_SHA"
            echo "engine_fingerprint: $(PYTHONPATH=.:build/release .venv/bin/python -c 'from tools.lib.engine_fingerprint import fingerprint; print(fingerprint())')"
            echo "model: $HF_REPO ${{ needs.plan.outputs.file }}"
            echo "replay: run ${{ inputs.games_run }} / $GAME, step $STEP"
            echo "pairs: $PAIRS  hidden: $HIDDEN  runners: $RUNNERS"
          } > reports/provenance.txt
          { echo '```'; cat reports/provenance.txt; echo '```'; cat reports/report.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-oracle-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
