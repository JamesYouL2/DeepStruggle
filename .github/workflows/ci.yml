# Continuous integration: the C++ suite, the backend Python suites and the type check on every
# push and pull request. The ts-replayer corpus is fetched once and cached, because the download
# is 300 throttled requests; the whole-corpus conversion test runs on demand, not on every push.
#
# tests/web needs the WebAssembly build and a Playwright browser, and tests/differential is WIP
# (BUGS.md TEST-1), so neither runs here -- see CLAUDE.md for which suite matches which change.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      corpus_full:
        description: "Also run the whole-corpus conversion test (minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_VERSION: "21"
  TRITON_CACHE_DIR: .triton_cache

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # external/struggler, which the type check and some tests import

      - uses: ./.github/actions/setup-engine
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: C++ suite
        run: |
          ./build/release/engine/ts_tests
          ./build/release/engine/ts_fuzz --games 2000

      - name: Restore the ts-replayer corpus
        uses: actions/cache@v4
        with:
          path: data/datasets/ts_replayer
          key: ts-replayer-corpus-v1
          restore-keys: ts-replayer-corpus-

      - name: Fetch the ts-replayer corpus snapshot
        # The corpus host throttles (300 requests) and fails on some games, so CI takes the
        # snapshot attached to the `corpus-v1` release of JamesYouL2/deepstruggle. Skipped on a
        # cache hit.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls -A data/datasets/ts_replayer 2>/dev/null)" ]; then
            gh release download corpus-v1 -R JamesYouL2/deepstruggle --pattern ts_replayer_corpus.tar.gz --dir "$RUNNER_TEMP"
            mkdir -p data/datasets
            tar -xzf "$RUNNER_TEMP/ts_replayer_corpus.tar.gz" -C data/datasets
          fi
          ls data/datasets/ts_replayer | wc -l

      - name: Backend tests
        run: |
          PYTHONPATH=.:build/release .venv/bin/python -m pytest -q -n auto \
            tests/bindings tests/engine_logic tests/replayer tests/training tests/docs

      - name: Whole-corpus conversion
        if: github.event_name == 'workflow_dispatch' && inputs.corpus_full
        run: PYTHONPATH=.:build/release .venv/bin/python -m pytest -q -n auto -m corpus_full tests/replayer

      # Explicit paths, never bare: a bare `pyrefly check` can match zero files and still exit 0.
      - name: Type check
        # Advisory until the bs4 typing errors in tools/scrape_card_strategies.py (10 of the 14
        # pyrefly reports on a fresh install) are fixed; then drop this line.
        continue-on-error: true
        run: |
          out=$(PYTHONPATH=.:build/release .venv/bin/pyrefly check ai tools tests web bindings 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | tail -3
          if echo "$out" | grep -q "No Python files matched"; then echo "pyrefly matched no files"; exit 1; fi
