# The doctrine census: how often the model follows a strong player's card rules (tools/doctrine_census.py).
#
#   gh workflow run doctrine_census.yml -f games=500 -f runners=8
#   gh run download <run-id> -n doctrine-census-<run-id> -D data/reports/ci
#
# Each runner plays `games` greedy self-play games from its own seed (its part number) and logs
# every card play, headline and coup; the pool job merges the parts into one report.
name: doctrine-census

on:
  # Registers the branch-only workflow (GitHub will not dispatch one it has never seen run); a
  # push run skips every job.
  push:
    branches: [exp/hungary-openings]
    paths: [.github/workflows/doctrine_census.yml]
  workflow_dispatch:
    inputs:
      games:
        description: "Greedy self-play games per runner"
        default: "500"
      runners:
        description: "Runners (each plays different deals)"
        default: "8"
      model:
        description: "`newest`, hf:<file.onnx>, or hf:<revision>:<run>/<snapshot>.pt (exported on the runner), or hf:gh:<run id>/<artifact>/<file.onnx>, or a search: spec holding one hf:pt:/hf:relpt: checkpoint (the searcher's census)"
        default: "newest"
      envs:
        description: "Games played at once per runner (a searcher batches its trees across them)"
        default: "32"
      hf_repo:
        description: "Hugging Face repo that `newest` is read from"
        default: "mihaild/deepstruggle"

permissions:
  contents: read
  actions: read   # a gh:<run>/<artifact>/<file> model is another run's artifact

env:
  GH_TOKEN: ${{ github.token }}
  GAMES: ${{ inputs.games || '500' }}
  RUNNERS: ${{ inputs.runners || '8' }}
  MODEL: ${{ inputs.model || 'newest' }}
  ENVS: ${{ inputs.envs || '32' }}
  HF_REPO: ${{ inputs.hf_repo || 'mihaild/deepstruggle' }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      file: ${{ steps.pin.outputs.file }}
      spec: ${{ steps.pin.outputs.spec }}
      parts: ${{ steps.pin.outputs.parts }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin the model and list the parts
        id: pin
        run: |
          if [ "$MODEL" = "newest" ]; then
            f=$(python3 tools/fetch_hf_model.py --repo "$HF_REPO" --resolve-only | tail -1)
          elif [[ "$MODEL" == search:* ]]; then
            # The checkpoint inside the spec is fetched as it is (a .pt) and the spec rewritten
            # to point at it, as the tournament workflow does for its search: entrants.
            read -r f spec < <(python3 - <<'PY'
          import os, re
          m = os.environ["MODEL"]
          pat = r"hf:((?:pt:|relpt:[\w.\-]+/)[\w.\-/@+]+\.pt)"
          files = re.findall(pat, m)
          if len(files) != 1:
              raise SystemExit(f"a search: census needs exactly one hf:pt:/hf:relpt: checkpoint, got {files}")
          local = "data/checkpoints/" + os.path.basename(files[0].split(":", 1)[1] if files[0].startswith("pt:") else files[0])
          print(files[0], re.sub(pat, local, m))
          PY
            )
            echo "spec=$spec" >> "$GITHUB_OUTPUT"
          else
            f="${MODEL#hf:}"
          fi
          echo "file=$f" >> "$GITHUB_OUTPUT"
          python3 -c "import json,os; print('parts=' + json.dumps(list(range(1, int(os.environ['RUNNERS']) + 1))))" >> "$GITHUB_OUTPUT"

  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300           # a search: census plays every decision searched
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - name: Play part ${{ matrix.part }} of ${{ env.RUNNERS }}
        run: |
          m=$(python3 tools/fetch_hf_model.py --repo "$HF_REPO" --path "${{ needs.plan.outputs.file }}" --out-dir data/checkpoints | tail -1)
          spec='${{ needs.plan.outputs.spec }}'
          tools/scripts/check_engine_fresh.sh && PYTHONPATH=.:build/release .venv/bin/python tools/doctrine_census.py run \
            --model "${spec:-$m}" --envs "$ENVS" \
            --games "$GAMES" --seed "${{ matrix.part }}" \
            --out "parts/part-${{ matrix.part }}.json.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: doctrine-census-part-${{ github.run_id }}-${{ matrix.part }}
          path: parts/
          if-no-files-found: error

  pool:
    needs: [plan, play]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - uses: actions/download-artifact@v4
        with:
          pattern: doctrine-census-part-${{ github.run_id }}-*
          path: parts/
          merge-multiple: true

      - name: Pool the parts
        run: |
          mkdir -p reports
          n=$(ls parts/part-*.json.gz 2>/dev/null | wc -l)
          if [ "$n" -ne "$RUNNERS" ]; then echo "only $n of $RUNNERS parts arrived; re-run the failed jobs"; exit 1; fi
          PYTHONPATH=.:build/release .venv/bin/python tools/doctrine_census.py report \
            --parts "parts/part-*.json.gz" --out-md reports/report.md --out-json reports/report.json
          {
            echo "commit: $GITHUB_SHA"
            echo "engine_fingerprint: $(PYTHONPATH=.:build/release .venv/bin/python -c 'from tools.lib.engine_fingerprint import fingerprint; print(fingerprint())')"
            echo "model: $HF_REPO ${{ needs.plan.outputs.file }}"
            echo "games/runner: $GAMES  runners: $RUNNERS  (greedy self-play)"
          } > reports/provenance.txt
          { echo '```'; cat reports/provenance.txt; echo '```'; cat reports/report.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctrine-census-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
