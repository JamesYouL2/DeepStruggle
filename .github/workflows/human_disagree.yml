# The model against strong human play: where it disagrees, and who is right (tools/human_disagree.py).
#
#   gh workflow run human_disagree.yml -f per_kind=60 -f pairs=32 -f runners=8
#   gh run download <run-id> -n human-disagree-<run-id> -D data/reports/ci
#
# Each runner takes its share of the ts-replayer corpus's distinct games (part k of N), scans every
# human decision against the model, and plays out up to `per_kind` disagreements of each kind; the
# pool job merges the parts. The corpus comes from the `corpus-v1` release snapshot, as in ci.yml.
name: human-disagree

on:
  # Registers the branch-only workflow (GitHub will not dispatch one it has never seen run); a
  # push run skips every job.
  push:
    branches: [exp/hungary-openings]
    paths: [.github/workflows/human_disagree.yml]
  workflow_dispatch:
    inputs:
      per_kind:
        description: "Disagreements played out per kind of decision, per runner"
        default: "60"
      max_p:
        description: "Only where the model gave the human's move less than this"
        default: "0.25"
      pairs:
        description: "Paired playouts per branch"
        default: "32"
      turns:
        description: "Only spots in these turns, comma-separated (empty = all)"
        default: ""
      runners:
        description: "Runners (each takes 1/N of the corpus)"
        default: "8"
      model:
        description: "`newest` or hf:<file.onnx>"
        default: "newest"
      hf_repo:
        description: "Hugging Face repo that `newest` is read from"
        default: "mihaild/deepstruggle"

permissions:
  contents: read

env:
  PER_KIND: ${{ inputs.per_kind || '60' }}
  MAX_P: ${{ inputs.max_p || '0.25' }}
  PAIRS: ${{ inputs.pairs || '32' }}
  TURNS: ${{ inputs.turns || '' }}
  RUNNERS: ${{ inputs.runners || '8' }}
  MODEL: ${{ inputs.model || 'newest' }}
  HF_REPO: ${{ inputs.hf_repo || 'mihaild/deepstruggle' }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      file: ${{ steps.pin.outputs.file }}
      parts: ${{ steps.pin.outputs.parts }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin the model and list the parts
        id: pin
        run: |
          if [ "$MODEL" = "newest" ]; then
            f=$(python3 tools/fetch_hf_model.py --repo "$HF_REPO" --resolve-only | tail -1)
          else
            f="${MODEL#hf:}"
          fi
          echo "file=$f" >> "$GITHUB_OUTPUT"
          python3 -c "import json,os; print('parts=' + json.dumps(list(range(1, int(os.environ['RUNNERS']) + 1))))" >> "$GITHUB_OUTPUT"

  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - name: Fetch the ts-replayer corpus snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download corpus-v1 -R JamesYouL2/deepstruggle --pattern ts_replayer_corpus.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p data/datasets
          tar -xzf "$RUNNER_TEMP/ts_replayer_corpus.tar.gz" -C data/datasets
          ls data/datasets/ts_replayer | wc -l

      - name: Play part ${{ matrix.part }} of ${{ env.RUNNERS }}
        run: |
          python3 tools/fetch_hf_model.py --repo "$HF_REPO" --path "${{ needs.plan.outputs.file }}" --out-dir data/checkpoints
          tools/scripts/check_engine_fresh.sh && PYTHONPATH=.:build/release .venv/bin/python tools/human_disagree.py run \
            --model "data/checkpoints/$(basename "${{ needs.plan.outputs.file }}")" \
            --part "${{ matrix.part }}/$RUNNERS" --per-kind "$PER_KIND" --max-p "$MAX_P" --pairs "$PAIRS" ${TURNS:+--turns "$TURNS"} \
            --out "parts/part-${{ matrix.part }}.json.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: human-disagree-part-${{ github.run_id }}-${{ matrix.part }}
          path: parts/
          if-no-files-found: error

  pool:
    needs: [plan, play]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - uses: actions/download-artifact@v4
        with:
          pattern: human-disagree-part-${{ github.run_id }}-*
          path: parts/
          merge-multiple: true

      - name: Pool the parts
        run: |
          mkdir -p reports
          n=$(ls parts/part-*.json.gz 2>/dev/null | wc -l)
          if [ "$n" -ne "$RUNNERS" ]; then echo "only $n of $RUNNERS parts arrived; re-run the failed jobs"; exit 1; fi
          PYTHONPATH=.:build/release .venv/bin/python tools/human_disagree.py report \
            --parts "parts/part-*.json.gz" --out-md reports/report.md --out-json reports/report.json
          {
            echo "commit: $GITHUB_SHA"
            echo "engine_fingerprint: $(PYTHONPATH=.:build/release .venv/bin/python -c 'from tools.lib.engine_fingerprint import fingerprint; print(fingerprint())')"
            echo "model: $HF_REPO ${{ needs.plan.outputs.file }}"
            echo "per kind/runner: $PER_KIND  max p: $MAX_P  pairs: $PAIRS  turns: ${TURNS:-all}  runners: $RUNNERS (corpus-v1)"
          } > reports/provenance.txt
          { echo '```'; cat reports/provenance.txt; echo '```'; cat reports/report.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-disagree-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
