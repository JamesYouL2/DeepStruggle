# The browser workbench on GitHub Pages: the engine compiled to WebAssembly and the page, built
# from main and published as static files. Nothing runs server-side -- models come from Hugging
# Face or a file dropped on the page, replays from a file.
#
# Enable once in the repository: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: "6.0.10"   # pinned, as tools/scripts/install_emsdk.sh is
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: ~/.local/opt/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        run: tools/scripts/install_emsdk.sh

      # Say which stats endpoint the page gets: an unset repository variable (or one set on the
      # github-pages environment, which this job does not use) builds a page that cannot submit.
      - name: Stats endpoint
        env:
          TS_STATS_ENDPOINT: ${{ vars.TS_STATS_ENDPOINT }}
        run: |
          if [[ -n "$TS_STATS_ENDPOINT" ]]; then
            echo "::notice::stats endpoint: $TS_STATS_ENDPOINT"
          else
            echo "::warning::vars.TS_STATS_ENDPOINT is empty: the page will offer the download only (web/stats_worker/README.md)"
          fi

      - name: Build the engine (WebAssembly) and the page
        env:
          # The page is served under /<repository>/ on Pages.
          TS_WEB_BASE: /${{ github.event.repository.name }}/
          TS_PYTHON: python3
          # The stats database's Worker (web/stats_worker/README.md); unset, games are not submitted.
          TS_STATS_ENDPOINT: ${{ vars.TS_STATS_ENDPOINT }}
        run: tools/scripts/build_web.sh

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
