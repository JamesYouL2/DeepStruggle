# The playout audit: where the model's own playouts disagree with what it plays (tools/playout_audit.py).
#
#   gh workflow run playout_audit.yml -f positions=1500 -f pairs=32 -f runners=16
#   gh run download <run-id> -n playout-audit-<run-id> -D data/reports/ci
#
# Each runner draws `positions` decisions from the model's greedy self-play (seeded by its part
# number) and plays every alternative `pairs` times; the pool job merges the parts, then re-plays
# the `confirm_top` largest single-situation regrets with fresh dice at `confirm_pairs`.
name: playout-audit

on:
  # Registers the branch-only workflow (GitHub will not dispatch one it has never seen run); a
  # push run skips every job.
  push:
    branches: [exp/hungary-openings]
    paths: [.github/workflows/playout_audit.yml]
  workflow_dispatch:
    inputs:
      positions:
        description: "Decisions per runner"
        default: "1500"
      pairs:
        description: "Paired playouts per alternative"
        default: "32"
      confirm_top:
        description: "Largest regrets re-tested with fresh dice"
        default: "48"
      confirm_pairs:
        description: "Paired playouts per alternative when confirming"
        default: "384"
      runners:
        description: "Runners (each finds different positions)"
        default: "16"
      parts:
        description: "Only these part numbers, comma-separated (empty = 1..runners), to redo failed parts"
        default: ""
      model:
        description: "`newest` or hf:<file.onnx>"
        default: "newest"
      hf_repo:
        description: "Hugging Face repo that `newest` is read from"
        default: "mihaild/deepstruggle"

permissions:
  contents: read

env:
  POSITIONS: ${{ inputs.positions || '1500' }}
  PAIRS: ${{ inputs.pairs || '32' }}
  CONFIRM_TOP: ${{ inputs.confirm_top || '48' }}
  CONFIRM_PAIRS: ${{ inputs.confirm_pairs || '384' }}
  RUNNERS: ${{ inputs.runners || '16' }}
  PARTS: ${{ inputs.parts || '' }}
  MODEL: ${{ inputs.model || 'newest' }}
  HF_REPO: ${{ inputs.hf_repo || 'mihaild/deepstruggle' }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      file: ${{ steps.pin.outputs.file }}
      parts: ${{ steps.pin.outputs.parts }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin the model and list the parts
        id: pin
        run: |
          if [ "$MODEL" = "newest" ]; then
            f=$(python3 tools/fetch_hf_model.py --repo "$HF_REPO" --resolve-only | tail -1)
          else
            f="${MODEL#hf:}"
          fi
          echo "file=$f" >> "$GITHUB_OUTPUT"
          python3 -c "import json,os; p=os.environ['PARTS']; print('parts=' + json.dumps([int(x) for x in p.split(',')] if p else list(range(1, int(os.environ['RUNNERS']) + 1))))" >> "$GITHUB_OUTPUT"

  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - name: Play part ${{ matrix.part }} of ${{ env.RUNNERS }}
        run: |
          python3 tools/fetch_hf_model.py --repo "$HF_REPO" --path "${{ needs.plan.outputs.file }}" --out-dir data/checkpoints
          tools/scripts/check_engine_fresh.sh && PYTHONPATH=.:build/release .venv/bin/python tools/playout_audit.py run \
            --model "data/checkpoints/$(basename "${{ needs.plan.outputs.file }}")" \
            --positions "$POSITIONS" --pairs "$PAIRS" --seed "${{ matrix.part }}" \
            --out "parts/part-${{ matrix.part }}.json.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: playout-audit-part-${{ github.run_id }}-${{ matrix.part }}
          path: parts/
          if-no-files-found: error

  pool:
    needs: [plan, play]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - uses: actions/download-artifact@v4
        with:
          pattern: playout-audit-part-${{ github.run_id }}-*
          path: parts/
          merge-multiple: true

      - name: Pool the parts
        run: |
          mkdir -p reports
          n=$(ls parts/part-*.json.gz 2>/dev/null | wc -l)
          want=$(python3 -c "import json; print(len(json.loads('${{ needs.plan.outputs.parts }}')))")
          if [ "$n" -ne "$want" ]; then echo "only $n of $want parts arrived; re-run the failed jobs"; exit 1; fi
          PYTHONPATH=.:build/release .venv/bin/python tools/playout_audit.py report \
            --parts "parts/part-*.json.gz" --out-md reports/report.md --out-json reports/report.json.gz
          {
            echo "commit: $GITHUB_SHA"
            echo "engine_fingerprint: $(PYTHONPATH=.:build/release .venv/bin/python -c 'from tools.lib.engine_fingerprint import fingerprint; print(fingerprint())')"
            echo "model: $HF_REPO ${{ needs.plan.outputs.file }}"
            echo "positions/runner: $POSITIONS  pairs: $PAIRS  confirm: top $CONFIRM_TOP at $CONFIRM_PAIRS  runners: $RUNNERS"
          } > reports/provenance.txt
          { echo '```'; cat reports/provenance.txt; echo '```'; cat reports/report.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the largest regrets with fresh dice
        run: |
          python3 tools/fetch_hf_model.py --repo "$HF_REPO" --path "${{ needs.plan.outputs.file }}" --out-dir data/checkpoints
          tools/scripts/check_engine_fresh.sh && PYTHONPATH=.:build/release .venv/bin/python tools/playout_audit.py confirm \
            --model "data/checkpoints/$(basename "${{ needs.plan.outputs.file }}")" --report reports/report.json.gz \
            --top "$CONFIRM_TOP" --pairs "$CONFIRM_PAIRS" --out-md reports/confirm.md --out-json reports/confirm.json
          cat reports/confirm.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playout-audit-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
