# Playout labels (tools/playout_labels.py): training labels from the model's own paired playouts.
#
#   gh workflow run playout_labels.yml -f decisions=1500 -f pairs=24 -f runners=16
#   gh run download <run-id> -n playout-labels-<run-id> -D data/reports/ci
#
# Each runner labels `decisions` decisions drawn from the model's greedy self-play (seeded by its part
# number); the pool job concatenates the parts into one labels.npz and summarises what they teach.
name: playout-labels

on:
  # Registers the branch-only workflow (GitHub will not dispatch one it has never seen run); a
  # push run skips every job.
  push:
    branches: [exp/hungary-openings]
    paths: [.github/workflows/playout_labels.yml]
  workflow_dispatch:
    inputs:
      decisions:
        description: "Decisions labelled per runner"
        default: "1500"
      pairs:
        description: "Paired playouts per candidate"
        default: "24"
      runners:
        description: "Runners (each finds different positions)"
        default: "16"
      model:
        description: "`newest` or hf:<file.onnx>"
        default: "newest"
      hf_repo:
        description: "Hugging Face repo that `newest` is read from"
        default: "mihaild/deepstruggle"

permissions:
  contents: read

env:
  DECISIONS: ${{ inputs.decisions || '1500' }}
  PAIRS: ${{ inputs.pairs || '24' }}
  RUNNERS: ${{ inputs.runners || '16' }}
  MODEL: ${{ inputs.model || 'newest' }}
  HF_REPO: ${{ inputs.hf_repo || 'mihaild/deepstruggle' }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      file: ${{ steps.pin.outputs.file }}
      parts: ${{ steps.pin.outputs.parts }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin the model and list the parts
        id: pin
        run: |
          if [ "$MODEL" = "newest" ]; then
            f=$(python3 tools/fetch_hf_model.py --repo "$HF_REPO" --resolve-only | tail -1)
          else
            f="${MODEL#hf:}"
          fi
          echo "file=$f" >> "$GITHUB_OUTPUT"
          python3 -c "import json,os; print('parts=' + json.dumps(list(range(1, int(os.environ['RUNNERS']) + 1))))" >> "$GITHUB_OUTPUT"

  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - name: Play part ${{ matrix.part }} of ${{ env.RUNNERS }}
        run: |
          python3 tools/fetch_hf_model.py --repo "$HF_REPO" --path "${{ needs.plan.outputs.file }}" --out-dir data/checkpoints
          tools/scripts/check_engine_fresh.sh && PYTHONPATH=.:build/release .venv/bin/python tools/playout_labels.py run \
            --model "data/checkpoints/$(basename "${{ needs.plan.outputs.file }}")" \
            --decisions "$DECISIONS" --pairs "$PAIRS" --seed "${{ matrix.part }}" \
            --out "parts/part-${{ matrix.part }}.npz"

      - uses: actions/upload-artifact@v4
        with:
          name: playout-labels-part-${{ github.run_id }}-${{ matrix.part }}
          path: parts/
          if-no-files-found: error

  pool:
    needs: [plan, play]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - uses: actions/download-artifact@v4
        with:
          pattern: playout-labels-part-${{ github.run_id }}-*
          path: parts/
          merge-multiple: true

      - name: Pool the parts
        run: |
          mkdir -p reports
          n=$(ls parts/part-*.npz 2>/dev/null | wc -l)
          if [ "$n" -ne "$RUNNERS" ]; then echo "only $n of $RUNNERS parts arrived; re-run the failed jobs"; exit 1; fi
          PYTHONPATH=.:build/release .venv/bin/python tools/playout_labels.py pool \
            --parts "parts/part-*.npz" --out reports/labels.npz --out-md reports/report.md --out-json reports/report.json
          {
            echo "commit: $GITHUB_SHA"
            echo "engine_fingerprint: $(PYTHONPATH=.:build/release .venv/bin/python -c 'from tools.lib.engine_fingerprint import fingerprint; print(fingerprint())')"
            echo "model: $HF_REPO ${{ needs.plan.outputs.file }}"
            echo "decisions/runner: $DECISIONS  pairs: $PAIRS  runners: $RUNNERS"
          } > reports/provenance.txt
          { echo '```'; cat reports/provenance.txt; echo '```'; cat reports/report.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playout-labels-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
