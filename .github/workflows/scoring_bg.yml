# Live scoring battlegrounds: does the model place for scoring, and is it right (tools/scoring_bg.py).
#
#   gh workflow run scoring_bg.yml -f games=60 -f pairs=32 -f runners=16
#   gh run download <run-id> -n scoring-bg-<run-id> -D data/reports/ci
#
# Each runner plays `games` greedy self-play games (seeded by its part number), records every
# influence play with a takeable battleground, and plays out up to `max_spots` spots where a live
# scoring battleground was takeable and the model placed elsewhere; the pool job merges the parts.
name: scoring-bg

on:
  # Registers the branch-only workflow (GitHub will not dispatch one it has never seen run); a
  # push run skips every job.
  push:
    branches: [exp/hungary-openings]
    paths: [.github/workflows/scoring_bg.yml]
  workflow_dispatch:
    inputs:
      games:
        description: "Greedy self-play games per runner"
        default: "60"
      pairs:
        description: "Paired playouts per branch"
        default: "32"
      max_spots:
        description: "Spots played out per runner"
        default: "400"
      runners:
        description: "Runners (each finds different positions)"
        default: "16"
      model:
        description: "`newest` or hf:<file.onnx>"
        default: "newest"
      hf_repo:
        description: "Hugging Face repo that `newest` is read from"
        default: "mihaild/deepstruggle"

permissions:
  contents: read

env:
  GAMES: ${{ inputs.games || '60' }}
  PAIRS: ${{ inputs.pairs || '32' }}
  MAX_SPOTS: ${{ inputs.max_spots || '400' }}
  RUNNERS: ${{ inputs.runners || '16' }}
  MODEL: ${{ inputs.model || 'newest' }}
  HF_REPO: ${{ inputs.hf_repo || 'mihaild/deepstruggle' }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      file: ${{ steps.pin.outputs.file }}
      parts: ${{ steps.pin.outputs.parts }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin the model and list the parts
        id: pin
        run: |
          if [ "$MODEL" = "newest" ]; then
            f=$(python3 tools/fetch_hf_model.py --repo "$HF_REPO" --resolve-only | tail -1)
          else
            f="${MODEL#hf:}"
          fi
          echo "file=$f" >> "$GITHUB_OUTPUT"
          python3 -c "import json,os; print('parts=' + json.dumps(list(range(1, int(os.environ['RUNNERS']) + 1))))" >> "$GITHUB_OUTPUT"

  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - name: Play part ${{ matrix.part }} of ${{ env.RUNNERS }}
        run: |
          python3 tools/fetch_hf_model.py --repo "$HF_REPO" --path "${{ needs.plan.outputs.file }}" --out-dir data/checkpoints
          tools/scripts/check_engine_fresh.sh && PYTHONPATH=.:build/release .venv/bin/python tools/scoring_bg.py run \
            --model "data/checkpoints/$(basename "${{ needs.plan.outputs.file }}")" \
            --games "$GAMES" --pairs "$PAIRS" --max-spots "$MAX_SPOTS" --seed "${{ matrix.part }}" \
            --out "parts/part-${{ matrix.part }}.json.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: scoring-bg-part-${{ github.run_id }}-${{ matrix.part }}
          path: parts/
          if-no-files-found: error

  pool:
    needs: [plan, play]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - uses: actions/download-artifact@v4
        with:
          pattern: scoring-bg-part-${{ github.run_id }}-*
          path: parts/
          merge-multiple: true

      - name: Pool the parts
        run: |
          mkdir -p reports
          n=$(ls parts/part-*.json.gz 2>/dev/null | wc -l)
          if [ "$n" -ne "$RUNNERS" ]; then echo "only $n of $RUNNERS parts arrived; re-run the failed jobs"; exit 1; fi
          PYTHONPATH=.:build/release .venv/bin/python tools/scoring_bg.py report \
            --parts "parts/part-*.json.gz" --out-md reports/report.md --out-json reports/report.json
          {
            echo "commit: $GITHUB_SHA"
            echo "engine_fingerprint: $(PYTHONPATH=.:build/release .venv/bin/python -c 'from tools.lib.engine_fingerprint import fingerprint; print(fingerprint())')"
            echo "model: $HF_REPO ${{ needs.plan.outputs.file }}"
            echo "games/runner: $GAMES  pairs: $PAIRS  max spots/runner: $MAX_SPOTS  runners: $RUNNERS"
          } > reports/provenance.txt
          { echo '```'; cat reports/provenance.txt; echo '```'; cat reports/report.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoring-bg-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
