# Turn 1 headlines over random deals (tools/scripts/setup_deal_matrix.py headlines): every listed
# USSR setup against every listed US setup on the worlds where one card was dealt to one side, the
# headline phase played greedy by one network, no playouts. The rows carry the world, so they join
# the setup-deal-matrix --random-deals runs of the same seed (their outcomes):
#
#   gh workflow run setup_headline_probe.yml --ref exp/setup-deal-matrix -f runners=10 \
#     -f args="--card 'East European Unrest' --holder us --ussr EG4/Pol4/Yug1 Pol3/Yug3 --us WG4/It4/Ir2"
#   gh run download <run-id> -n setup-headline-probe-<run-id> -D data/reports/t1_openings/eeu_a13
#
# stage=reply forces the holder's headline to the card and plays the other side's turn 1 twice, by
# the network and by a searched player (a load_agent spec, {MODEL} for the model, which must then
# be a .pt), the rest greedy to the end:
#
#   gh workflow run setup_headline_probe.yml --ref exp/setup-deal-matrix -f stage=reply -f runners=30 \
#     -f model="E7-A8-R1-S44@6400M+R34@7200M+R48@9170M+A13_20261014_105711/swa_11920-12000M.pt" -f worlds=30000 \
#     -f args="--ussr Pol3/Yug3 EG4/Pol4/Yug1 --us WG3/Fr3/It2/Ir2 WG4/It4/Ir2"
#
# stage=ar1 forces the holder's headline to the card and the other side's first action round of
# turn 1 once per arm (--arms; net, card3, coup_italy, repair, repair_bg), greedy otherwise and to
# the end; no searched player, so the .onnx default serves:
#
#   gh workflow run setup_headline_probe.yml --ref exp/setup-deal-matrix -f stage=ar1 -f runners=40 \
#     -f args="--ussr Pol3/Yug3 EG4/Pol4/Yug1 --us WG3/Fr3/It2/Ir2 WG4/It4/Ir2"
#
# stage=draws plays games from random deals and redeals every turn's newly drawn cards --redeals
# ways (what each card is worth to draw, by turn); --worlds is the number of games:
#
#   gh workflow run setup_headline_probe.yml --ref exp/setup-deal-matrix -f stage=draws -f runners=40 \
#     -f worlds=60000 -f args="--redeals 16"
#
# stage=ever plays games from random deals greedy to the end, one row per game: every card each side
# ever held (with the turn it first did) and the result; --worlds is the number of games:
#
#   gh workflow run setup_headline_probe.yml --ref exp/setup-deal-matrix -f stage=ever -f runners=20 -f worlds=200000
name: setup-headline-probe

on:
  # The push trigger only registers the workflow from this branch (a dispatch-only workflow that is
  # not on the default branch cannot be dispatched); every job is skipped on it.
  push:
    branches: [exp/setup-deal-matrix]
    paths: [.github/workflows/setup_headline_probe.yml]
  workflow_dispatch:
    inputs:
      stage:
        description: "headlines (greedy headlines only), reply (the forced headline, turn 1 searched), ar1 (the reply's AR1 forced, per arm) draws (every turn's draw redealt) or ever (every card each side ever held, per game)"
        default: "headlines"
      player:
        description: "stage=reply: the searched player"
        default: "rollout:{MODEL}:4:32:4:z2:earlier:own"
      model:
        description: "Model in the Hugging Face repo (.onnx or .pt); the default is A13+R48's SWA"
        default: "E7-A8-R1-S44@6400M+R34@7200M+R48@9170M+A13_20261014_105711/swa_11920-12000M.onnx"
      worlds:
        description: "Worlds dealt (only those where the card went to the holder are played)"
        default: "200000"
      runners:
        default: "10"
      args:
        description: "--ussr ... --us ... (required but for draws), --card, --holder, --seed; reply: --turns, --chunk; ar1: --arms, --chunk; draws: --redeals, --chunk"
        default: ""
      hf_repo:
        default: "mihaild/deepstruggle"

permissions:
  contents: read

env:
  PYTHONPATH: .:build/release
  STAGE: ${{ inputs.stage }}
  PLAYER: ${{ inputs.player }}
  MODEL: ${{ inputs.model }}
  WORLDS: ${{ inputs.worlds }}
  RUNNERS: ${{ inputs.runners }}
  ARGS: ${{ inputs.args }}
  HF_REPO: ${{ inputs.hf_repo }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        run: echo "parts=$(python3 -c "import json,os; print(json.dumps(list(range(1, int(os.environ['RUNNERS']) + 1))))")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Fetch the model
        run: |
          mkdir -p models
          curl -sSfL --retry 3 -o "models/$(basename "$MODEL")" "https://huggingface.co/$HF_REPO/resolve/main/$MODEL"
          sha256sum "models/$(basename "$MODEL")"
      - name: ${{ inputs.stage }} (part ${{ matrix.part }})
        run: |
          mkdir -p out
          eval "set -- $ARGS"
          if [ "$STAGE" = reply ]; then set -- --player "$PLAYER" "$@"; fi
          tools/scripts/check_engine_fresh.sh
          python tools/scripts/setup_deal_matrix.py "$STAGE" --model "models/$(basename "$MODEL")" \
            --worlds "$WORLDS" --part "${{ matrix.part }}/$RUNNERS" \
            --out "out/matrix-${{ matrix.part }}.jsonl.gz" "$@"
      - uses: actions/upload-artifact@v4
        with:
          name: setup-headline-probe-part-${{ github.run_id }}-${{ matrix.part }}
          path: out/
          retention-days: 14

  pool:
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: setup-headline-probe-part-${{ github.run_id }}-*
          path: parts
          merge-multiple: true
      - name: Pool
        run: |
          mkdir -p report
          python tools/scripts/setup_deal_matrix.py pool --parts parts/matrix-*.jsonl.gz --expect "$RUNNERS" \
            --out report/headlines.jsonl.gz
          {
            echo "commit: $GITHUB_SHA"
            echo "stage: $STAGE  player: $PLAYER"
            echo "model: $HF_REPO $MODEL  worlds: $WORLDS  runners: $RUNNERS  args: $ARGS"
            echo "parts: $(cat report/headlines.jsonl.gz.parts.json)"
          } > report/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: setup-headline-probe-${{ github.run_id }}
          path: report/
          retention-days: 90
