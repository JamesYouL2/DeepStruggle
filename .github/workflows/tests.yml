# The engine's C++ suite and the backend Python suite (everything but tests/web, which has its
# own workflow because it needs Emscripten and a browser). Measured on a 4-worker run: C++ under a
# second, bindings + engine_logic + docs ~20 s, training ~3 min -- so training is its own job and
# the groups run side by side.
#
# tests/replayer is not run here: it needs the human corpus, which is not committed and would be
# fetched from ts-replayer.fly.dev. Run it locally (CLAUDE.md, "The ts-replayer corpus"). The
# corpus-based tests in tests/engine_logic are excluded by name below rather than left to skip, so
# a green run does not count them as checked.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The subprocess tests (e.g. test_import_survives_older_engine) do not inherit pytest.ini's
  # `pythonpath`, so build/release must be on PYTHONPATH itself.
  PYTHONPATH: .:build/release

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: C++ unit tests
        run: ./build/release/engine/ts_tests
      - name: Invariant fuzzing
        run: ./build/release/engine/ts_fuzz --games 10000

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: core
            paths: >-
              tests/bindings tests/engine_logic tests/docs
              --ignore=tests/engine_logic/test_headline_resolution_order.py
              --deselect=tests/engine_logic/test_china_card_space_race.py::test_replay_247_converts_end_to_end
              --deselect=tests/engine_logic/test_cuban_missile_crisis_choice.py::test_replay_264_converts_end_to_end
              --deselect=tests/engine_logic/test_norad_action_round_scope.py::test_replay_296_gets_past_its_bear_trap_escape
          - name: training
            paths: tests/training
    name: python (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: pytest
        run: python -m pytest -q -n auto ${{ matrix.group.paths }}
