# docker compose -f deploy/web/compose.yaml up -d --build
#
# CHECKPOINTS points at a checkpoints tree laid out like data/checkpoints (<run>/snapshot_*.pt);
# the analysis panel lists whatever is there. It is mounted read-only: the server never writes it.
services:
  web:
    build:
      context: .
      args:
        REF: ${DEEPSTRUGGLE_REF:-main}
    image: deepstruggle-web
    # The host's loopback only: there is no authentication, and anyone who reaches the port can
    # read the mounted checkpoints. To serve other machines, put an authenticating reverse proxy in
    # front (it reaches this port on 127.0.0.1) -- or, knowingly, set BIND=0.0.0.0.
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - ${CHECKPOINTS:-./checkpoints}:/data/checkpoints:ro
      - replays:/data/replays
      - onnx_cache:/data/onnx_cache
    restart: unless-stopped

volumes:
  replays:
  onnx_cache:
